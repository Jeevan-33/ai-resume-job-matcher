server {
    listen 10000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router) - fall back to index.html for
    # any path that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; never cache index.html itself so a
    # new deploy is picked up immediately instead of from a stale cache.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
